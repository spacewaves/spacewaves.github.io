<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07091a">
<title>Neon Rift — Wave Arcade</title>
<style>
:root{color-scheme:dark;--cyan:#57f7ff;--pink:#ff4fe1;--lime:#c6ff5c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07091a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4f7ff}
body{display:grid;place-items:center}
#wrap{position:relative;width:100%;height:100%;min-height:320px;background:radial-gradient(ellipse at 50% 40%,#10183a 0%,#07091a 68%);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.brand{position:absolute;left:clamp(12px,3vw,28px);top:clamp(12px,3vw,24px);font-size:clamp(12px,1.6vw,15px);letter-spacing:.22em;text-transform:uppercase;color:#b6c8ff;text-shadow:0 0 14px #3c7cff}
.brand b{display:block;color:#fff;font-size:clamp(20px,3vw,30px);letter-spacing:.12em}
.stats{position:absolute;right:clamp(12px,3vw,28px);top:clamp(12px,3vw,24px);text-align:right;font-size:12px;color:#9eb1e8;letter-spacing:.12em}
.stats strong{display:block;font-size:clamp(18px,2.5vw,25px);color:white;letter-spacing:.04em}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,510px);text-align:center;padding:26px 22px;border:1px solid #57f7ff55;border-radius:22px;background:linear-gradient(145deg,#101b3ddd,#0a0d20ee);box-shadow:0 0 50px #00d9ff15,inset 0 0 35px #8a38ff0b;pointer-events:auto}
.center.hidden{display:none}
.kicker{color:var(--cyan);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
h1{margin:8px 0 10px;font-size:clamp(32px,7vw,54px);line-height:1;font-weight:900;letter-spacing:.05em;text-shadow:0 0 22px #39e8ff66}
p{margin:10px auto 18px;max-width:390px;color:#b7c4e8;font-size:14px;line-height:1.55}
button{appearance:none;border:0;border-radius:999px;padding:13px 25px;background:linear-gradient(100deg,#57f7ff,#b1fffb);color:#081225;font-weight:900;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 24px #57f7ff45}
button:focus-visible{outline:2px solid white;outline-offset:4px}
.small{font-size:11px;color:#7e8db8;margin-top:15px}
.mobilehint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:.1em;color:#65739f;pointer-events:none}
@media (hover:hover) and (pointer:fine){.mobilehint{opacity:.65}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" aria-label="Neon Rift wave arcade game"></canvas>
<div class="hud">
  <div class="brand">ARCADE / 01<b>NEON RIFT</b></div>
  <div class="stats">SECTOR <strong id="sector">01</strong><span id="progress">0% COMPLETE</span></div>
  <div class="center" id="panel">
    <div class="kicker" id="kicker">A NEW NEON RUN</div>
    <h1 id="heading">NEON RIFT</h1>
    <p id="message">Lướt qua mê cung ánh sáng. Giữ chuột, chạm màn hình hoặc giữ phím Space để bay lên; thả ra để hạ xuống.</p>
    <button id="start">Bắt đầu chơi</button>
    <div class="small">W / SPACE / CLICK / TOUCH · ESC TẠM DỪNG</div>
  </div>
  <div class="mobilehint" id="hint">GIỮ ĐỂ BAY LÊN · THẢ ĐỂ HẠ XUỐNG</div>
</div>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const panel = document.getElementById('panel');
const startBtn = document.getElementById('start');
const heading = document.getElementById('heading');
const message = document.getElementById('message');
const kicker = document.getElementById('kicker');
const sectorEl = document.getElementById('sector');
const progressEl = document.getElementById('progress');
const hint = document.getElementById('hint');

let W=800,H=500,dpr=1, state='ready', held=false, last=0, elapsed=0, distance=0;
let player={x:150,y:250,vy:0,trail:[]};
let obstacles=[], particles=[], stars=[], checkpoints=[];
let best=Number(localStorage.getItem('neonRiftBest')||0);
const levelLength=7200, speed=245;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
  const r=canvas.getBoundingClientRect(); dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(320,r.width); H=Math.max(320,r.height);
  canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  player.x=W*.24;
  if(state==='ready'){player.y=H*.5;}
  stars=Array.from({length:Math.floor(W*H/6500)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()*.6+.2,phase:Math.random()*6}));
}
window.addEventListener('resize',resize);
function makeLevel(){
  obstacles=[];checkpoints=[];
  // Hand-designed, original zig-zag corridor made from paired neon bars.
  const patterns=[
    [0.30,0.68],[0.43,0.78],[0.27,0.61],[0.20,0.52],[0.38,0.72],
    [0.48,0.82],[0.25,0.57],[0.17,0.49],[0.34,0.66],[0.44,0.78],
    [0.24,0.56],[0.15,0.47],[0.35,0.69],[0.47,0.81],[0.28,0.60],
    [0.19,0.51],[0.39,0.73],[0.27,0.59],[0.45,0.79],[0.20,0.53]
  ];
  let x=530;
  patterns.forEach((p,i)=>{
    const gapTop=p[0]*H, gapBottom=p[1]*H;
    const width=22+(i%4===0?8:0);
    obstacles.push({x,w:width,top:gapTop,bottom:gapBottom,phase:i%2});
    if(i%5===4) checkpoints.push(x+150);
    x+=250+(i%3)*22;
  });
}
function reset(){
  distance=0;elapsed=0;player.y=H*.5;player.vy=0;player.trail=[];
  particles=[];makeLevel();state='playing';panel.classList.add('hidden');hint.style.display='block';last=performance.now();
}
function showPanel(mode){
  panel.classList.remove('hidden');
  if(mode==='dead'){
    kicker.textContent='RUN ENDED';heading.textContent='TRY AGAIN';
    message.textContent=`Bạn đã đi được ${Math.floor(distance/levelLength*100)}% hành trình. Kỷ lục: ${best}%. Thử lại và tìm đường xuyên qua khe sáng!`;
    startBtn.textContent='Chơi lại';
  }else if(mode==='win'){
    kicker.textContent='SECTOR CLEARED';heading.textContent='RIFT MASTER';
    message.textContent='Bạn đã vượt qua toàn bộ đường hầm neon. Một hành trình mới đang chờ!';
    startBtn.textContent='Chơi lại';
  }else if(mode==='pause'){
    kicker.textContent='SYSTEM PAUSED';heading.textContent='TẠM DỪNG';
    message.textContent='Nhấn tiếp tục để quay lại đường đua.';
    startBtn.textContent='Tiếp tục';
  }else{
    kicker.textContent='AN ORIGINAL WAVE ARCADE';heading.textContent='NEON RIFT';
    message.textContent='Lướt qua mê cung ánh sáng. Giữ chuột, chạm màn hình hoặc giữ phím Space để bay lên; thả ra để hạ xuống.';
    startBtn.textContent='Bắt đầu chơi';
  }
  hint.style.display='none';
}
function burst(x,y,color,n=12){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.55,max:.9,color,r:1+Math.random()*2.5});}
}
function endGame(win=false){
  state=win?'win':'dead';
  const pct=Math.floor(Math.min(1,distance/levelLength)*100);
  best=Math.max(best,pct);localStorage.setItem('neonRiftBest',String(best));
  showPanel(win?'win':'dead');
}
function inputDown(e){if(e&&e.cancelable)e.preventDefault();held=true;}
function inputUp(){held=false;}
canvas.addEventListener('pointerdown',inputDown);
window.addEventListener('pointerup',inputUp);
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();held=true;if(state==='ready'||state==='dead'||state==='win')reset();}
  if(e.code==='Escape'&&state==='playing'){state='pause';showPanel('pause');}
});
window.addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))held=false;});
startBtn.addEventListener('click',()=>{if(state==='pause'){state='playing';panel.classList.add('hidden');last=performance.now();}else reset();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing'){state='pause';showPanel('pause');}});
function lineGlow(color,width,blur){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=blur;}
function drawBackground(dt){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*.54,H*.48,5,W*.54,H*.48,Math.max(W,H)*.8);
  g.addColorStop(0,'#101b3c');g.addColorStop(.65,'#090d22');g.addColorStop(1,'#050611');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.x-=dt*(8+s.r*8);if(s.x<0){s.x=W;s.y=Math.random()*H;}ctx.globalAlpha=s.a*(.75+.25*Math.sin(elapsed*2+s.phase));ctx.fillStyle='#b4eaff';ctx.fillRect(s.x,s.y,s.r,s.r);});ctx.globalAlpha=1;
  // perspective grid
  ctx.save();ctx.strokeStyle='#3852a522';ctx.lineWidth=1;
  const horizon=H*.5;
  for(let i=-12;i<=12;i++){ctx.beginPath();ctx.moveTo(W*.5+i*8,horizon);ctx.lineTo(W*.5+i*W*.12,H);ctx.stroke();}
  const shift=(elapsed*60)%36;
  for(let y=horizon;y<H+40;y+=36){ctx.beginPath();ctx.moveTo(0,y+shift);ctx.lineTo(W,y+shift);ctx.stroke();}
  ctx.restore();
  // side rails
  ctx.save();lineGlow('#663cff',2,12);ctx.beginPath();ctx.moveTo(0,H*.08);ctx.lineTo(W,H*.08);ctx.moveTo(0,H*.92);ctx.lineTo(W,H*.92);ctx.stroke();ctx.restore();
}
function drawObstacle(o){
  const x=o.x-distance+player.x;
  if(x<-60||x>W+60)return;
  const topH=Math.max(0,o.top),botY=o.bottom,barW=o.w;
  ctx.save();
  // dark solid blocks with bright edge
  const grad1=ctx.createLinearGradient(x,0,x+barW,0);grad1.addColorStop(0,'#10183b');grad1.addColorStop(.5,'#18234d');grad1.addColorStop(1,'#10183b');
  ctx.fillStyle=grad1;ctx.fillRect(x,0,barW,topH);
  ctx.fillRect(x,botY,barW,H-botY);
  ctx.fillStyle='#57f7ff';ctx.shadowColor='#57f7ff';ctx.shadowBlur=18;
  ctx.fillRect(x-2,topH-2,barW+4,3);ctx.fillRect(x-2,botY-1,barW+4,3);
  ctx.fillStyle='#ff4fe1';ctx.shadowColor='#ff4fe1';ctx.shadowBlur=12;
  ctx.fillRect(x+barW*.5-1,0,2,topH);ctx.fillRect(x+barW*.5-1,botY,2,H-botY);
  ctx.restore();
}
function drawPlayer(dt){
  const x=player.x,y=player.y;
  player.trail.unshift({x:x-5,y,life:1});if(player.trail.length>16)player.trail.pop();
  player.trail.forEach((p,i)=>{p.life-=dt*1.6;ctx.globalAlpha=Math.max(0,p.life)*(1-i/18)*.6;ctx.fillStyle=i%2?'#ff4fe1':'#57f7ff';ctx.beginPath();ctx.arc(p.x-i*3,p.y,Math.max(1,5-i*.25),0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(x,y);ctx.rotate(clamp(player.vy/550,-.45,.45));
  ctx.shadowBlur=22;ctx.shadowColor='#57f7ff';ctx.fillStyle='#f7ffff';
  ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-10,-9);ctx.lineTo(-5,0);ctx.lineTo(-10,9);ctx.closePath();ctx.fill();
  ctx.shadowColor='#ff4fe1';ctx.shadowBlur=16;ctx.strokeStyle='#ff4fe1';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}
function update(dt){
  elapsed+=dt;
  if(state==='playing'){
    distance+=speed*dt;
    const gravity=held?-930:930;
    player.vy+=gravity*dt;player.vy=clamp(player.vy,-460,460);
    player.y+=player.vy*dt;
    if(player.y<H*.08+7||player.y>H*.92-7){burst(player.x,player.y,'#ff4fe1',18);endGame();return;}
    for(const o of obstacles){
      const x=o.x-distance+player.x;
      if(x<player.x+14&&x+o.w>player.x-10){
        if(player.y-7<o.top||player.y+7>o.bottom){burst(player.x,player.y,'#57f7ff',22);endGame();return;}
      }
    }
    if(distance>=levelLength) {endGame(true);return;}
    sectorEl.textContent=String(Math.min(3,1+Math.floor(distance/(levelLength/3)))).padStart(2,'0');
    progressEl.textContent=Math.floor(distance/levelLength*100)+'% COMPLETE';
  }
  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy*=.985;p.life-=dt;});
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function frame(now){
  const dt=Math.min(.035,Math.max(0,(now-last)/1000||0));last=now;
  drawBackground(dt);
  if(state==='ready'){elapsed+=dt;player.y=H*.5+Math.sin(elapsed*1.5)*H*.055;}
  if(state==='playing'||state==='dead'||state==='win'||state==='pause'){
    obstacles.forEach(drawObstacle);
  }else{
    // Preview corridor in title screen
    const preview=[{x:W*.58,w:24,top:H*.25,bottom:H*.62},{x:W*.82,w:24,top:H*.42,bottom:H*.77}];
    preview.forEach(o=>{const old=distance;distance=0;const save=o.x;o.x+=0;drawObstacle({...o,x:o.x-player.x});distance=old;});
  }
  drawPlayer(dt);drawParticles();
  if(state==='playing')update(dt);
  requestAnimationFrame(frame);
}
resize();makeLevel();requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
</body>
</html>
